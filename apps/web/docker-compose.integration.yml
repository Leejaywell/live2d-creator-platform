services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: live2d
      POSTGRES_PASSWORD: live2d
      POSTGRES_DB: live2d_creator_platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U live2d -d live2d_creator_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: live2dminio
      MINIO_ROOT_PASSWORD: live2dminiosecret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  create-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 live2dminio live2dminiosecret &&
      mc mb --ignore-existing local/live2d-creator-platform
      "

  mailpit:
    image: axllent/mailpit:v1.26
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  fake-openai:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "fake-openai-server.mjs"]
    volumes:
      - ./scripts/fake-openai-server.mjs:/app/fake-openai-server.mjs:ro
    ports:
      - "4010:4010"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4010/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  fake-redis-rest:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "fake-redis-rest-server.mjs"]
    volumes:
      - ./scripts/fake-redis-rest-server.mjs:/app/fake-redis-rest-server.mjs:ro
    ports:
      - "4020:4020"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4020/health"]
      interval: 5s
      timeout: 5s
      retries: 20
