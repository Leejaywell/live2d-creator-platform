<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Live2D Creator Platform Prototype</title>
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="platform-shell">
      <aside class="sidebar" aria-label="平台导航">
        <div class="brand">
          <span class="brand-mark">L2</span>
          <div>
            <strong>Creator Platform</strong>
            <span>Live2D AI companion MVP</span>
          </div>
        </div>
        <nav class="nav-list" id="nav-list" aria-label="主要功能">
          <button class="nav-item active" type="button" data-view="overview">总览</button>
          <button class="nav-item" type="button" data-view="project">项目设置</button>
          <button class="nav-item" type="button" data-view="model">模型管理</button>
          <button class="nav-item" type="button" data-view="voices">语音资产</button>
          <button class="nav-item" type="button" data-view="tags">触发标签</button>
          <button class="nav-item" type="button" data-view="codes">粉丝访问码</button>
          <button class="nav-item" type="button" data-view="admin">管理后台</button>
          <button class="nav-item" type="button" data-view="audience">粉丝入口</button>
        </nav>
        <div class="sidebar-note">
          <strong id="sidebar-plan-name">Pro Trial</strong>
          <span id="sidebar-plan-meta">有效至 2026-07-06</span>
        </div>
      </aside>

      <section class="workspace-panel" aria-label="平台工作区">
        <header class="workspace-header">
          <div>
            <p class="section-label">Streamer workspace</p>
            <h1 id="view-title">总览</h1>
          </div>
          <div class="header-actions">
            <button class="secondary-button" id="copy-share-link" type="button">复制分享链接</button>
            <button class="primary-button" id="publish-project" type="button">发布项目</button>
          </div>
        </header>

        <section class="workspace-content" id="workspace-content" aria-live="polite"></section>
      </section>

      <aside class="preview-panel" aria-label="粉丝页面预览">
        <div class="preview-header">
          <div>
            <p class="section-label">Audience page</p>
            <strong id="preview-title">尤里 Urzis</strong>
          </div>
          <span class="status-pill" id="project-status-pill">draft</span>
        </div>

        <section class="phone" aria-label="companion app">
          <header class="status-bar">
            <button class="icon-button close" type="button" aria-label="关闭">×</button>
            <div class="title-block">
              <strong id="phone-project-title">尤里 Urzis - 智能桌面伴侣</strong>
              <span id="model-status">模型加载中</span>
            </div>
            <button class="icon-button" id="search-button" type="button" aria-label="搜索">⌕</button>
            <button class="icon-button" id="more-button" type="button" aria-label="更多">⋯</button>
          </header>

          <canvas id="bg-canvas" aria-hidden="true"></canvas>

          <section class="access-gate" id="access-gate" aria-label="访问码校验">
            <div class="gate-box">
              <strong>输入粉丝访问码</strong>
              <p id="gate-message">发布项目并生成访问码后，粉丝可进入聊天页。</p>
              <form id="access-form">
                <input id="access-code-input" autocomplete="off" placeholder="例如 YURI-2026" />
                <button type="submit">进入</button>
              </form>
            </div>
          </section>

          <section class="chat-area" aria-label="对话">
            <div class="message-list" id="chat-list"></div>
          </section>

          <section class="model-area" aria-label="Live2D 模型区域">
            <canvas id="live2d-canvas"></canvas>
            <div class="model-fallback" id="model-fallback">
              <div class="fallback-avatar">狐</div>
              <p>模型加载失败时显示占位。可在模型管理中替换 model3.json。</p>
            </div>
          </section>

          <nav class="side-actions" aria-label="快捷操作">
            <button class="round-button" id="settings-button" type="button" aria-label="设置">⚙</button>
            <button class="round-button" id="drawer-button" type="button" aria-label="动作">✦</button>
            <button class="round-button" id="voice-button" type="button" aria-label="语音">♪</button>
          </nav>

          <section class="action-drawer" id="action-drawer" aria-label="动作面板">
            <div class="drawer-section">
              <h2>预置语音</h2>
              <div class="chip-grid" id="voice-grid"></div>
            </div>
            <div class="drawer-section">
              <h2>情绪</h2>
              <div class="chip-grid" id="emotion-grid"></div>
            </div>
            <div class="drawer-section">
              <h2>配饰 / 形态</h2>
              <div class="chip-grid" id="form-grid"></div>
            </div>
          </section>

          <form class="input-area" id="chat-form">
            <input id="chat-input" name="message" autocomplete="off" placeholder="和尤里 Urzis 说话..." />
            <button type="submit">发送</button>
          </form>

          <section class="settings-panel" id="settings-panel" aria-label="设置面板">
            <div class="panel-header">
              <h2>预览设置</h2>
              <button class="icon-button" id="close-settings" type="button" aria-label="关闭设置">×</button>
            </div>
            <label>
              模型地址 model3.json
              <input id="model-url" type="url" />
            </label>
            <div class="range-row">
              <label for="scale-range">缩放</label>
              <input id="scale-range" type="range" min="0.35" max="1.6" step="0.01" value="1.05" />
            </div>
            <div class="range-row">
              <label for="x-range">横向</label>
              <input id="x-range" type="range" min="-240" max="240" step="1" value="0" />
            </div>
            <div class="range-row">
              <label for="y-range">纵向</label>
              <input id="y-range" type="range" min="-220" max="180" step="1" value="70" />
            </div>
            <label>
              OpenAI-compatible Endpoint
              <input id="api-endpoint" type="url" placeholder="可选，例如 https://api.example.com/v1/chat/completions" />
            </label>
            <label>
              API Key
              <input id="api-key" type="password" placeholder="仅本地演示保存；生产请改后端代理" />
            </label>
            <label>
              模型名
              <input id="api-model" type="text" placeholder="deepseek-chat / gpt-4.1-mini 等" />
            </label>
            <div class="panel-actions">
              <button id="reload-model" type="button">重新加载模型</button>
              <button id="reset-settings" type="button">恢复默认</button>
            </div>
            <p class="security-note">生产环境不要把 API Key 放前端。请用后端代理、登录鉴权和用量限制。</p>
          </section>
        </section>
      </aside>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
